<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .term-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; font-size: 13px; fill: #c9d1d9; }
    .cyan { fill: #38bdf8; font-weight: bold; }
    .blue { fill: #60a5fa; font-weight: bold; }
    .white { fill: #f0f6fc; }
    .gray { fill: #8b949e; }
    .green { fill: #4ade80; font-weight: bold; }
    .yellow { fill: #facc15; }
    .bold { font-weight: bold; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="580" rx="16" fill="#030712" />

  <!-- Terminal Window -->
  <g filter="url(#shadow)" transform="translate(30, 25)">
    <!-- Terminal Body -->
    <rect width="820" height="530" rx="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

    <!-- Terminal Title Bar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 810 0 C 815.523 0 820 4.477 820 10 L 820 38 L 0 38 Z" fill="#161b22" stroke="#30363d" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="22" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="42" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="62" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Window Title -->
    <text x="410" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e" font-weight="500">root@server: /opt/helper-bot — Helper AI Bot CLI</text>

    <!-- Terminal Content -->
    <g transform="translate(32, 65)">
      <!-- ASCII Art Banner -->
      <text class="term-text cyan" x="0" y="16">  _  _ _____ _     ___ ___ ___ </text>
      <text class="term-text cyan" x="0" y="32"> | || | ____| |   | _ \ __| _ \</text>
      <text class="term-text cyan" x="0" y="48"> | __ |  _| | |   |  _/ _||   /</text>
      <text class="term-text cyan" x="0" y="64"> |_||_|_____|____ |_| |___|_|_\</text>

      <!-- App Title -->
      <text class="term-text" x="0" y="94">
        <tspan class="blue bold">Helper AI Bot</tspan>
        <tspan class="gray"> - </tspan>
        <tspan class="white">Telegram Assistant CLI</tspan>
      </text>
      <text class="term-text gray" x="0" y="110">--------------------------------------------------</text>

      <!-- System Info Grid -->
      <text class="term-text" x="0" y="132">
        <tspan class="cyan">OS            </tspan><tspan class="gray"> : </tspan><tspan class="white">Ubuntu 22.04.4 LTS x86_64</tspan>
      </text>
      <text class="term-text" x="0" y="152">
        <tspan class="cyan">Kernel        </tspan><tspan class="gray"> : </tspan><tspan class="white">5.15.0-105-generic</tspan>
      </text>
      <text class="term-text" x="0" y="172">
        <tspan class="cyan">Python        </tspan><tspan class="gray"> : </tspan><tspan class="white">3.10.12</tspan>
      </text>
      <text class="term-text" x="0" y="192">
        <tspan class="cyan">Directory     </tspan><tspan class="gray"> : </tspan><tspan class="white">/opt/helper-bot</tspan>
      </text>
      <text class="term-text" x="0" y="212">
        <tspan class="cyan">Service       </tspan><tspan class="gray"> : </tspan><tspan class="green">Active (Running)</tspan>
      </text>
      <text class="term-text" x="0" y="232">
        <tspan class="cyan">AI Model      </tspan><tspan class="gray"> : </tspan><tspan class="white">gpt-4o-mini</tspan>
      </text>
      <text class="term-text gray" x="0" y="250">--------------------------------------------------</text>

      <!-- Color Palette Blocks -->
      <g transform="translate(0, 262)">
        <rect x="0" y="0" width="22" height="12" fill="#000000" rx="2" />
        <rect x="26" y="0" width="22" height="12" fill="#ef4444" rx="2" />
        <rect x="52" y="0" width="22" height="12" fill="#22c55e" rx="2" />
        <rect x="78" y="0" width="22" height="12" fill="#eab308" rx="2" />
        <rect x="104" y="0" width="22" height="12" fill="#3b82f6" rx="2" />
        <rect x="130" y="0" width="22" height="12" fill="#a855f7" rx="2" />
        <rect x="156" y="0" width="22" height="12" fill="#06b6d4" rx="2" />
        <rect x="182" y="0" width="22" height="12" fill="#f1f5f9" rx="2" />

        <rect x="0" y="16" width="22" height="12" fill="#64748b" rx="2" />
        <rect x="26" y="16" width="22" height="12" fill="#f87171" rx="2" />
        <rect x="52" y="16" width="22" height="12" fill="#4ade80" rx="2" />
        <rect x="78" y="16" width="22" height="12" fill="#fde047" rx="2" />
        <rect x="104" y="16" width="22" height="12" fill="#60a5fa" rx="2" />
        <rect x="130" y="16" width="22" height="12" fill="#c084fc" rx="2" />
        <rect x="156" y="16" width="22" height="12" fill="#22d3ee" rx="2" />
        <rect x="182" y="16" width="22" height="12" fill="#ffffff" rx="2" />
      </g>

      <!-- Interactive Menu Prompt -->
      <text class="term-text" x="0" y="316">
        <tspan class="white bold">Helper Bot is installed. Choose an action </tspan>
        <tspan class="gray">(Use UP/DOWN arrows, press ENTER to select):</tspan>
      </text>

      <!-- Active Menu Selection (Blue highlighted) -->
      <rect x="-8" y="330" width="750" height="24" rx="4" fill="#1e3a8a" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
      <text class="term-text blue bold" x="0" y="346">&gt; [x] Update Bot (Pull latest code and restart)</text>

      <!-- Other Menu Options -->
      <text class="term-text gray" x="0" y="370">  [ ] Reconfigure Settings (Edit API keys and model)</text>
      <text class="term-text gray" x="0" y="392">  [ ] Restart Service</text>
      <text class="term-text gray" x="0" y="414">  [ ] View Status &amp; Logs</text>
      <text class="term-text gray" x="0" y="436">  [ ] Uninstall Bot</text>
      <text class="term-text gray" x="0" y="458">  [ ] Exit</text>
    </g>
  </g>
</svg>
