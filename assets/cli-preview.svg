<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <!-- Dot pattern for background -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2d3748" fill-opacity="0.4" />
    </pattern>

    <!-- Terminal shadow -->
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <style>
    .t-code { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace; font-size: 13.5px; }
    .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .c-cyan { fill: #22d3ee; }
    .c-blue { fill: #38bdf8; font-weight: bold; }
    .c-white { fill: #f8fafc; }
    .c-gray { fill: #64748b; }
    .c-green { fill: #4ade80; }
    .c-yellow { fill: #facc15; }
    .c-dim { fill: #94a3b8; }
  </style>

  <!-- Canvas Background -->
  <rect width="900" height="620" fill="#0b0f17" />
  <rect width="900" height="620" fill="url(#dotPattern)" />

  <!-- Terminal Window -->
  <g filter="url(#windowShadow)" transform="translate(45, 35)">
    <!-- Terminal Outer Frame -->
    <rect width="810" height="550" rx="12" fill="#121820" stroke="#1e293b" stroke-width="1.5" />

    <!-- Terminal Header / Titlebar -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 798 0 C 804.627 0 810 5.373 810 12 L 810 38 L 0 38 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

    <!-- macOS Traffic Light Buttons -->
    <circle cx="24" cy="19" r="6" fill="#ef4444" />
    <circle cx="44" cy="19" r="6" fill="#f59e0b" />
    <circle cx="64" cy="19" r="6" fill="#10b981" />

    <!-- Centered Terminal Title -->
    <text x="405" y="24" text-anchor="middle" class="t-title">root@cb948efaa60c: /</text>

    <!-- Terminal Inner Text Area -->
    <g transform="translate(30, 62)">
      <!-- ASCII Logo -->
      <text class="t-code c-cyan" x="0" y="16">  _  _ _____ _     ___ ___ ___ </text>
      <text class="t-code c-cyan" x="0" y="32"> | || | ____| |   | _ \ __| _ \</text>
      <text class="t-code c-cyan" x="0" y="48"> | __ |  _| | |   |  _/ _||   /</text>
      <text class="t-code c-cyan" x="0" y="64"> |_||_|_____|____ |_| |___|_|_\</text>

      <!-- App Subtitle -->
      <text class="t-code" x="0" y="98">
        <tspan class="c-blue">Helper AI Bot</tspan>
        <tspan class="c-gray">  -  </tspan>
        <tspan class="c-white">Telegram Assistant CLI</tspan>
      </text>

      <text class="t-code c-gray" x="0" y="118">--------------------------------------------------</text>

      <!-- System Details Table -->
      <text class="t-code" x="0" y="140">
        <tspan class="c-cyan">OS            </tspan><tspan class="c-gray"> : </tspan><tspan class="c-white">Ubuntu 22.04.2 LTS</tspan>
      </text>
      <text class="t-code" x="0" y="162">
        <tspan class="c-cyan">Kernel        </tspan><tspan class="c-gray"> : </tspan><tspan class="c-white">6.18.15+deb13-cloud-amd64</tspan>
      </text>
      <text class="t-code" x="0" y="184">
        <tspan class="c-cyan">Python        </tspan><tspan class="c-gray"> : </tspan><tspan class="c-white">3.10.12</tspan>
      </text>
      <text class="t-code" x="0" y="206">
        <tspan class="c-cyan">Directory     </tspan><tspan class="c-gray"> : </tspan><tspan class="c-white">/opt/helper-bot</tspan>
      </text>
      <text class="t-code" x="0" y="228">
        <tspan class="c-cyan">Service       </tspan><tspan class="c-gray"> : </tspan><tspan class="c-green">Active (Running)</tspan>
      </text>
      <text class="t-code" x="0" y="250">
        <tspan class="c-cyan">AI Model      </tspan><tspan class="c-gray"> : </tspan><tspan class="c-white">gpt-4o-mini</tspan>
      </text>

      <text class="t-code c-gray" x="0" y="270">--------------------------------------------------</text>

      <!-- Fastfetch Color Palette Grid -->
      <g transform="translate(0, 284)">
        <rect x="0" y="0" width="24" height="13" fill="#1e293b" rx="2" />
        <rect x="28" y="0" width="24" height="13" fill="#ef4444" rx="2" />
        <rect x="56" y="0" width="24" height="13" fill="#22c55e" rx="2" />
        <rect x="84" y="0" width="24" height="13" fill="#eab308" rx="2" />
        <rect x="112" y="0" width="24" height="13" fill="#3b82f6" rx="2" />
        <rect x="140" y="0" width="24" height="13" fill="#a855f7" rx="2" />
        <rect x="168" y="0" width="24" height="13" fill="#06b6d4" rx="2" />
        <rect x="196" y="0" width="24" height="13" fill="#cbd5e1" rx="2" />

        <rect x="0" y="17" width="24" height="13" fill="#475569" rx="2" />
        <rect x="28" y="17" width="24" height="13" fill="#f87171" rx="2" />
        <rect x="56" y="17" width="24" height="13" fill="#4ade80" rx="2" />
        <rect x="84" y="17" width="24" height="13" fill="#fde047" rx="2" />
        <rect x="112" y="17" width="24" height="13" fill="#60a5fa" rx="2" />
        <rect x="140" y="17" width="24" height="13" fill="#c084fc" rx="2" />
        <rect x="168" y="17" width="24" height="13" fill="#22d3ee" rx="2" />
        <rect x="196" y="17" width="24" height="13" fill="#ffffff" rx="2" />
      </g>

      <!-- Menu Instruction -->
      <text class="t-code" x="0" y="342">
        <tspan class="c-white" font-weight="bold">Helper Bot CLI. Choose an action </tspan>
        <tspan class="c-gray">(Use UP/DOWN arrows, press ENTER to select):</tspan>
      </text>

      <!-- Selected Active Option -->
      <text class="t-code c-cyan" font-weight="bold" x="0" y="372">&gt; [x] Install / Update Helper Bot</text>

      <!-- Menu Inactive Options -->
      <text class="t-code c-dim" x="0" y="396">  [ ] Reconfigure Settings (Edit API keys and model)</text>
      <text class="t-code c-dim" x="0" y="420">  [ ] Restart Service</text>
      <text class="t-code c-dim" x="0" y="444">  [ ] View Status &amp; Logs</text>
      <text class="t-code c-dim" x="0" y="468">  [ ] Uninstall Bot</text>
      <text class="t-code c-dim" x="0" y="492">  [ ] Exit</text>
    </g>
  </g>
</svg>
